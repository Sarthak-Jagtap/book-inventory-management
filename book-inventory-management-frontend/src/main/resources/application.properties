# --------------------------------------------
# Frontend Server Config
# --------------------------------------------

# Frontend runs on port 8081 (backend is on 8080, so they don't clash)
server.port=8081

# Application name
spring.application.name=book-inventory-frontend

# --------------------------------------------
# Backend API Base URL
# --------------------------------------------

# This is the address of your backend machine.
# Right now both are on localhost, so it's localhost:8080.
# When you move to different machines, just change this ONE line.
# Example: backend.api.base-url=http://192.168.1.105:8080
backend.api.base-url=http://localhost:8080

# --------------------------------------------
# Thymeleaf Config
# --------------------------------------------

# During development: set to false so changes to HTML reflect immediately
# (without restarting the server)
spring.thymeleaf.cache=false

# --------------------------------------------
# Session Config
# --------------------------------------------

# We store the JWT token in the HTTP session after login.
# Session timeout: 30 minutes of inactivity
server.servlet.session.timeout=30m

# --------------------------------------------
# Logging (optional but helpful during development)
# --------------------------------------------

# Shows what RestClient is sending/receiving in console
logging.level.org.springframework.web.client=DEBUG

# --------------------------------------------
# Spring Security Session Fix
# --------------------------------------------

# Prevents Spring Security from redirecting to /login
# when it can't find a UserDetailsService for form processing
# (since we handle login manually in AuthViewController)
spring.security.user.name=disabled
spring.security.user.password=disabled

# Session cookie settings
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict