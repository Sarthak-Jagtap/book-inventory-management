<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Review — Book Inventory</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ── Success Toast ─────────────────────────────────── -->
<div class="toast toast-success" th:if="${successMsg}" id="appToast">
  <span class="toast-icon">&#10003;</span>
  <span th:text="${successMsg}">Review submitted successfully!</span>
</div>

<!-- ── Error Toast ───────────────────────────────────── -->
<div class="toast toast-error" th:if="${errorMsg}" id="appToast">
  <span class="toast-icon">&#10005;</span>
  <span th:text="${errorMsg}">Something went wrong.</span>
</div>

<!-- ── Page Header ───────────────────────────────────── -->
<div class="page-header">
  <a href="/ui/review-dashboard" class="page-header-back">&#8592; Back</a>
  <div>
    <h1>Create Review</h1>
    <div class="meta">POST /api/v1/reviews/book</div>
  </div>
</div>

<!-- ── Form ──────────────────────────────────────────── -->
<div class="form-page">
  <div class="form-box animate-in">
    <h2>New Review</h2>
    <p class="sub">Submit a book review from a registered reviewer.</p>

    <form action="/ui/reviews/form" method="post" th:object="${review}">
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}" />

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="isbn">ISBN</label>
          <input class="form-control" type="text" id="isbn"
                 th:field="*{isbn}" placeholder="e.g. 978-3-16-148410-0" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reviewerId">Reviewer ID</label>
          <input class="form-control" type="number" id="reviewerId"
                 th:field="*{reviewerId}" placeholder="e.g. 101" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="rating">Rating</label>
        <input class="form-control" type="number" id="rating"
               th:field="*{rating}" placeholder="1 – 10" min="1" max="10">
        <p class="form-hint">Enter a value between 1 (lowest) and 10 (highest).</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="comments">Comments</label>
        <input class="form-control" type="text" id="comments"
               th:field="*{comments}" placeholder="Share your thoughts on this book…">
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-2">
        &#xff0b; Submit Review
      </button>
    </form>

    <div class="form-footer">
      <a href="/ui/review-dashboard">&#8592; Back to Dashboard</a>
    </div>
  </div>
</div>

<script>
  const t = document.getElementById('appToast');
  if (t) setTimeout(() => t.remove(), 3000);
</script>
</body>
</html>
