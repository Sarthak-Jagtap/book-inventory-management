<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Publisher Details</title>
</head>

<body>

	<h2>Publisher Details</h2>

	<p><b>ID:</b> <span th:text="${publisher.publisherId}"></span></p>
	<p><b>Name:</b> <span th:text="${publisher.name}"></span></p>
	<p><b>City:</b> <span th:text="${publisher.city}"></span></p>
	<p><b>State Code:</b> <span th:text="${publisher.stateCode}"></span></p>

</body>

</html>
