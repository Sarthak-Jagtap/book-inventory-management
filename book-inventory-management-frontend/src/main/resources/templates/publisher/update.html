<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Update Publisher</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Update Publisher</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Modify registered information</div>
			</div>

			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/publishers}">← Cancel</a>
			</div>
		</div>

		<div class="card" style="padding: 24px; max-width: 500px;">
			<form th:action="@{/publishers/update}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div style="margin-bottom: 16px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Publisher
						ID</label>
					<input type="number" name="publisherId" th:value="${param.publisherId}" readonly
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background-color: #f3f4f6; color: #6b7280; cursor: not-allowed;">
				</div>

				<div style="margin-bottom: 16px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Company
						Name</label>
					<input type="text" name="name" required
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;">
				</div>

				<div style="margin-bottom: 16px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">City</label>
					<input type="text" name="city"
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;">
				</div>

				<div style="margin-bottom: 24px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">State
						Code</label>
					<input type="text" name="stateCode" required
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;"
						placeholder="e.g. NY">
				</div>

				<button type="submit" class="btn btn-primary">Save Changes</button>
			</form>
		</div>
	</div>
</body>

</html>
