<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Publishers List</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Publishers</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Registered publishing houses and locations
				</div>
			</div>
			<div style="display: flex; gap: 8px;">
				<a class="btn btn-secondary btn-sm" th:href="@{/publishers/id}">Search ID</a>
				<a class="btn btn-secondary btn-sm" th:href="@{/publishers/state}">Filter State</a>
				<a class="btn btn-primary btn-sm" th:href="@{/publishers/add}">+ Add Publisher</a>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>
			</div>

			
		</div>

		<div class="card">
			<table class="table" style="width:100%; border-collapse:collapse;">
				<thead style="background-color: #f9fafb; border-bottom: 1px solid #e5e7eb;">
					<tr>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							ID</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Name</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Location</th>
						<th
							style="padding: 12px 16px; text-align: right; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Actions</th>
					</tr>
				</thead>
				<tbody style="font-size: 14px; color: #374151;">
					<tr th:each="p : ${publishers}" style="border-bottom: 1px solid #f3f4f6;">
						<td style="padding: 12px 16px; font-weight: 600;" th:text="${p.publisherId}"></td>
						<td style="padding: 12px 16px;" th:text="${p.name}"></td>
						<td style="padding: 12px 16px;" th:text="${p.city + ', ' + p.stateCode}"></td>
						<td style="padding: 12px 16px; text-align: right;">
							<a th:href="@{/publishers/details(publisherId=${p.publisherId})}"
								class="btn btn-secondary btn-sm" style="padding: 4px 8px;">Details</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
