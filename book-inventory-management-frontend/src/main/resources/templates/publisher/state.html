<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Search by State</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Publishers by State</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Filter publishing houses by their regional
					location</div>
			</div>

			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/publishers}">← View All</a>
			</div>
		</div>

		<div class="card" style="padding: 24px; max-width: 500px; margin-bottom: 24px;">
			<form th:action="@{/publishers/state}" method="get">
				<div style="margin-bottom: 16px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Enter
						2-Letter State Code</label>
					<input type="text" name="stateCode" required class="form-control"
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;"
						placeholder="e.g. NY, CA, WA">
				</div>
				<button type="submit" class="btn btn-primary">Find Publishers</button>
			</form>
		</div>

		<div class="card" th:if="${publishers != null}">
			<table class="table" style="width:100%; border-collapse:collapse;">
				<thead style="background-color: #f9fafb; border-bottom: 1px solid #e5e7eb;">
					<tr>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Name</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							City</th>
						<th
							style="padding: 12px 16px; text-align: right; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Actions</th>
					</tr>
				</thead>
				<tbody style="font-size: 14px; color: #374151;">
					<tr th:each="p : ${publishers}" style="border-bottom: 1px solid #f3f4f6;">
						<td style="padding: 12px 16px; font-weight: 600;" th:text="${p.name}"></td>
						<td style="padding: 12px 16px;" th:text="${p.city}"></td>
						<td style="padding: 12px 16px; text-align: right;">
							<a th:href="@{/publishers/details(publisherId=${p.publisherId})}"
								class="btn btn-secondary btn-sm" style="padding: 4px 8px;">View</a>
						</td>
					</tr>
				</tbody>
			</table>
			<div th:if="${#lists.isEmpty(publishers)}" style="padding: 40px; text-align: center; color: #9ca3af;">
				No publishers found for this state.
			</div>
		</div>
	</div>
</body>

</html>
