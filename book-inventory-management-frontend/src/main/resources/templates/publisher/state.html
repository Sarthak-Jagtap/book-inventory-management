<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Publishers by State</title>
</head>

<body>

	<h2>Search Publishers by State</h2>

	<form action="/publishers/state" method="get">
		<label>State Code:</label>
		<input type="text" name="stateCode" required>
		<button type="submit">Search</button>
	</form>

	<hr>

	<div th:if="${publishers != null}">
		<table border="1">
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th>City</th>
				<th>State</th>
			</tr>

			<tr th:each="p : ${publishers}">
				<td th:text="${p.publisherId}"></td>
				<td th:text="${p.name}"></td>
				<td th:text="${p.city}"></td>
				<td th:text="${p.stateCode}"></td>
			</tr>
		</table>
	</div>

</body>

</html>
