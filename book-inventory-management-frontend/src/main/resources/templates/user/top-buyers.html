<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Top Buyers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-head">
  <a class="back-link" th:href="@{/team/user-module}">← Back</a>
  <div><h1>Top Buyers</h1><div class="meta" th:text="${apiEndpoint}"></div></div>
  <span class="new-tag" style="margin-left:auto;">NEW</span>
</div>
<div class="page-wrapper-sm">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="sep">›</span><span>Top Buyers</span></div>
  <div class="api-info"><strong>What this API does</strong><span th:text="${apiDescription}"></span></div>
  <div class="alert alert-error" th:if="${error!=null}"><span>⚠</span><span th:text="${error}"></span></div>
  <div th:if="${topBuyers!=null and !topBuyers.isEmpty()}" class="card" style="padding:0;">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Rank</th><th>User ID</th><th>Full Name</th><th>Username</th><th>Purchases</th></tr></thead>
        <tbody>
          <tr th:each="b,stat : ${topBuyers}">
            <td><strong th:text="${stat.index+1}">1</strong></td>
            <td class="mono" th:text="${b.get('userId')}"></td>
            <td th:text="${(b.get('firstName')!=null?b.get('firstName'):'')+' '+(b.get('lastName')!=null?b.get('lastName'):'')}">Name</td>
            <td class="mono" th:text="${b.get('userName')}"></td>
            <td><strong style="color:#1a6dbd;" th:text="${b.get('purchaseCount')}">0</strong></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="empty" th:if="${topBuyers==null or topBuyers.isEmpty()}"><div class="icon">🏆</div><h3>No purchase data</h3></div>
</div>
<div class="footer">Book Inventory Management — User Module</div>
</body></html>
