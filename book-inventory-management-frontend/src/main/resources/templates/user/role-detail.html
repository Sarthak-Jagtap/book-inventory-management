<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Role Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-head">
  <a class="back-link" th:href="@{/user/api/roles}">← Back to Roles</a>
  <div><h1>Role Detail</h1><div class="meta" th:text="${apiEndpoint}"></div></div>
</div>
<div class="page-wrapper-sm">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="sep">›</span><a th:href="@{/user/api/roles}">Roles</a><span class="sep">›</span><span>Detail</span></div>
  <div class="api-info"><strong>What this API does</strong><span th:text="${apiDescription}"></span></div>
  <div class="alert alert-error" th:if="${error!=null}"><span>⚠</span><span th:text="${error}"></span></div>
  <div th:if="${role!=null}" class="card" style="padding:0;">
    <table class="data-table">
      <thead><tr><th colspan="2">Role — API Response</th></tr></thead>
      <tbody>
        <tr>
          <td style="width:180px;color:#6b7280;">Role Number</td>
          <td class="mono" th:text="${role.roleNumber}"></td>
        </tr>
        <tr>
          <td style="color:#6b7280;">Role Name</td>
          <td>
            <span class="role-pill"
              th:classappend="${role.permRole=='Admin'}?'role-admin':(${role.permRole=='StoreOwner'}?'role-owner':(${role.permRole=='RegisteredUser'}?'role-user':'role-guest'))"
              th:text="${role.permRole}">Role</span>
          </td>
        </tr>
        <tr>
          <td style="color:#6b7280;">Access Level</td>
          <td class="text-muted"
            th:text="${role.permRole=='Admin'}?'Full system access — can do everything':(${role.permRole=='StoreOwner'}?'Inventory and purchase management':(${role.permRole=='RegisteredUser'}?'Profile, cart, and purchase access':'Public read-only API access'))">
          </td>
        </tr>
      </tbody>
    </table>
    <div style="padding:14px 16px;border-top:1px solid #f3f4f6;">
      <a class="btn btn-secondary btn-sm" th:href="@{/user/api/roles/{n}/user-count(n=${role.roleNumber})}">
        How many users have this role? →
      </a>
    </div>
  </div>
</div>
<div class="footer">Book Inventory Management — User Module</div>
</body></html>
