<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-head">
  <a class="back-link" th:href="@{/team/user-module}">← Back</a>
  <div><h1>Admin Dashboard</h1><div class="meta" th:text="${apiEndpoint}"></div></div>
  <span class="new-tag" style="margin-left:auto;">NEW</span>
</div>
<div class="page-wrapper-sm">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="sep">›</span><span>Admin Dashboard</span></div>
  <div class="api-info"><strong>What this API does</strong><span th:text="${apiDescription}"></span></div>
  <div class="alert alert-error" th:if="${error!=null}"><span>⚠</span><span th:text="${error}"></span></div>
  <div th:if="${dashboard!=null}">
    <div class="stat-row">
      <div class="stat-box"><div class="label">Total Users</div><div class="value" th:text="${dashboard.get('totalUsers')}">0</div><div class="note">All accounts</div></div>
      <div class="stat-box"><div class="label">Total Purchases</div><div class="value" th:text="${dashboard.get('totalPurchases')}">0</div><div class="note">All records</div></div>
    </div>
    <!-- Users by role table -->
    <div class="card" style="padding:0;margin-bottom:16px;">
      <div class="card-header" style="padding:10px 14px;">Users by Role — from same API call</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Role</th><th>User Count</th></tr></thead>
          <tbody>
            <tr th:each="entry : ${dashboard.get('userCountByRole')}">
              <td><span class="role-pill"
                th:classappend="${entry.key=='Admin'}?'role-admin':(${entry.key=='StoreOwner'}?'role-owner':(${entry.key=='RegisteredUser'}?'role-user':'role-guest'))"
                th:text="${entry.key}">Role</span></td>
              <td><strong style="color:#1a6dbd;" th:text="${entry.value}">0</strong></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a class="btn btn-secondary btn-sm" th:href="@{/user/api/admin/users}">View All Users →</a>
      <a class="btn btn-secondary btn-sm" th:href="@{/user/api/store-owner/stats}">Purchase Stats →</a>
    </div>
  </div>
</div>
<div class="footer">Book Inventory Management — User Module</div>
</body></html>
