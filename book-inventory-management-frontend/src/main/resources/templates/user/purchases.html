<!-- purchases.html — my own purchases -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Purchases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-header">
  <a class="page-header-back" th:href="@{/team/user-module}">←</a>
  <div><h1>My Purchases</h1>
    <p><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted-d);" th:text="${apiEndpoint}"></code></p>
  </div>
  <span class="tag" style="margin-left:auto;" th:text="${purchaseCount + ' purchases'}">0 purchases</span>
</div>
<div class="section-sm" style="max-width:900px;">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="breadcrumb-sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="breadcrumb-sep">›</span><span>My Purchases</span></div>
  <div class="result-description animate-in" th:text="${apiDescription}"></div>
  <div class="alert alert-error" th:if="${error != null}"><span>⚠️</span><span th:text="${error}"></span></div>
  <div th:if="${purchases != null and !purchases.isEmpty()}" class="animate-in delay-1">
    <div class="data-table-wrapper">
      <table class="data-table">
        <thead><tr><th>Inventory ID</th><th>Buyer Info</th></tr></thead>
        <tbody>
          <tr th:each="p : ${purchases}">
            <td><span style="font-family:var(--font-mono);font-size:13px;background:var(--bg-muted);padding:3px 8px;border-radius:4px;border:1px solid var(--border-light);" th:text="'#' + ${p.inventoryId}"></span></td>
            <td style="font-size:13px;color:var(--text-muted-d);">Purchased by <strong th:text="${p.userName}">username</strong></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="empty-state" th:if="${purchases == null or purchases.isEmpty()}">
    <div class="empty-state-icon">🛒</div>
    <h3>No purchases yet</h3>
    <p>You haven't purchased any inventory items</p>
    <a class="btn btn-primary" style="margin-top:16px;" th:href="@{/team/user-module}">← Back to Endpoints</a>
  </div>
</div>
<footer class="footer"><p>Book Inventory · <a th:href="@{/team/user-module}">← Back to endpoints</a></p></footer>
</body>
</html>
