<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>All Users — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-head">
  <a class="back-link" th:href="@{/team/user-module}">← Back</a>
  <div><h1>All Users</h1><div class="meta" th:text="${apiEndpoint}"></div></div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
    <span class="tag" th:text="${userCount+' users'}">0</span>
    <a class="btn btn-secondary btn-sm" th:href="@{/user/api/admin/search}">Search</a>
    <a class="btn btn-secondary btn-sm" th:href="@{/user/api/admin/users/by-role}">By Role</a>
    <a class="btn btn-secondary btn-sm" th:href="@{/user/api/admin/dashboard}">Dashboard</a>
  </div>
</div>
<div class="page-wrapper-sm">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="sep">›</span><span>All Users</span></div>
  <div class="api-info"><strong>What this API does</strong><span th:text="${apiDescription}"></span></div>
  <div class="alert alert-error" th:if="${error!=null}"><span>⚠</span><span th:text="${error}"></span></div>
  <div th:if="${users!=null and !users.isEmpty()}" class="card" style="padding:0;">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>User ID</th><th>Full Name</th><th>Username</th><th>Phone</th><th>Role</th><th>Action</th></tr></thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td class="mono" th:text="${u.userId}"></td>
            <td th:text="${u.fullName}">Name</td>
            <td class="mono" th:text="${u.userName}"></td>
            <td class="text-muted" th:text="${u.phoneNumber!=null?u.phoneNumber:'—'}"></td>
            <td><span class="role-pill" th:if="${u.role!=null}"
              th:classappend="${u.role.permRole=='Admin'}?'role-admin':(${u.role.permRole=='StoreOwner'}?'role-owner':(${u.role.permRole=='RegisteredUser'}?'role-user':'role-guest'))"
              th:text="${u.role.permRole}">Role</span></td>
            <td><a class="btn btn-secondary btn-sm" th:href="@{/user/api/admin/users/{id}(id=${u.userId})}">View</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="empty" th:if="${users==null or users.isEmpty()}"><div class="icon">👥</div><h3>No users found</h3></div>
</div>
<div class="footer">Book Inventory Management — User Module</div>
</body></html>
