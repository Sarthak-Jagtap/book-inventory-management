<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Users by Role</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-head">
  <a class="back-link" th:href="@{/team/user-module}">← Back</a>
  <div><h1>Users by Role</h1><div class="meta" th:text="${apiEndpoint}"></div></div>
  <span class="new-tag" style="margin-left:auto;">NEW</span>
</div>
<div class="page-wrapper-sm">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="sep">›</span><span>Users by Role</span></div>
  <div class="api-info"><strong>What this API does</strong><span th:text="${apiDescription}"></span></div>
  <div class="alert alert-error" th:if="${error!=null}"><span>⚠</span><span th:text="${error}"></span></div>
  <!-- Role selector -->
  <div class="card mb-2">
    <div class="card-header">Select Role</div>
    <form th:action="@{/user/api/admin/users/by-role}" method="get" style="display:flex;gap:10px;align-items:flex-end;">
      <div class="form-group" style="margin:0;flex:1;">
        <label class="form-label">Role</label>
        <select class="form-control" name="roleNumber">
          <option th:each="r : ${allRoles}" th:value="${r.roleNumber}"
                  th:text="${r.permRole}" th:selected="${r.roleNumber==roleNumber}">Role</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Filter</button>
    </form>
  </div>
  <div th:if="${users!=null and !users.isEmpty()}">
    <p class="text-muted text-small mb-1" th:text="${users.size()+' user(s) with this role'}"></p>
    <div class="card" style="padding:0;">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>User ID</th><th>Full Name</th><th>Username</th><th>Phone</th></tr></thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td class="mono" th:text="${u.userId}"></td>
              <td th:text="${u.fullName}"></td>
              <td class="mono" th:text="${u.userName}"></td>
              <td class="text-muted" th:text="${u.phoneNumber!=null?u.phoneNumber:'—'}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="empty" th:if="${users==null or users.isEmpty()}"><div class="icon">👥</div><h3>No users with this role</h3></div>
</div>
<div class="footer">Book Inventory Management — User Module</div>
</body></html>
