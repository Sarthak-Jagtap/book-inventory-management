<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>User Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-header">
  <a class="page-header-back" th:href="@{/user/api/admin/users}">←</a>
  <div><h1>User Detail</h1>
    <p><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted-d);" th:text="${apiEndpoint}"></code></p>
  </div>
</div>
<div class="section-sm" style="max-width:700px;">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="breadcrumb-sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="breadcrumb-sep">›</span><a th:href="@{/user/api/admin/users}">All Users</a><span class="breadcrumb-sep">›</span><span>Detail</span></div>
  <div class="result-description animate-in" th:text="${apiDescription}"></div>
  <div class="alert alert-error" th:if="${error != null}"><span>⚠️</span><span th:text="${error}"></span></div>
  <div th:if="${user != null}" class="animate-in delay-1">
    <div class="profile-card">
      <div class="profile-card-top">
        <div class="profile-avatar-lg" th:text="${user.initials}">AB</div>
        <div>
          <div class="profile-name" th:text="${user.fullName}">Name</div>
          <div class="profile-uname">@<span th:text="${user.userName}">username</span></div>
          <div style="margin-top:8px;">
            <span class="role-pill" th:if="${user.role != null}"
                  th:classappend="${user.role.permRole == 'Admin'} ? 'role-admin' : (${user.role.permRole == 'StoreOwner'} ? 'role-owner' : (${user.role.permRole == 'RegisteredUser'} ? 'role-user-r' : 'role-guest'))"
                  th:text="${user.role.permRole}">Role</span>
          </div>
        </div>
      </div>
      <div class="profile-card-body">
        <div class="profile-field"><span class="profile-field-icon">🆔</span><div><div class="profile-field-label">User ID</div><div class="profile-field-value" th:text="${user.userId}"></div></div></div>
        <div class="profile-field"><span class="profile-field-icon">📞</span><div><div class="profile-field-label">Phone</div><div class="profile-field-value" th:text="${user.phoneNumber != null ? user.phoneNumber : 'Not provided'}"></div></div></div>
        <div class="profile-field"><span class="profile-field-icon">🎭</span><div><div class="profile-field-label">Role ID</div><div class="profile-field-value" th:text="${user.role != null ? user.role.roleNumber : 'Unknown'}"></div></div></div>
      </div>
    </div>
  </div>
</div>
<footer class="footer"><p>Book Inventory · <a th:href="@{/team/user-module}">← Back to endpoints</a></p></footer>
</body>
</html>
