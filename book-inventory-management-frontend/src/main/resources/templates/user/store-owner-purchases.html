<!-- store-owner-purchases.html — reused for all 3 store-owner purchase endpoints -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Purchases — Book Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-header">
  <a class="page-header-back" th:href="@{/team/user-module}">←</a>
  <div><h1 th:text="${currentPage != null ? currentPage : 'Purchases'}">Purchases</h1>
    <p><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted-d);" th:text="${apiEndpoint}"></code></p>
  </div>
  <span class="tag" style="margin-left:auto;" th:text="${(purchases != null ? purchases.size() : 0) + ' records'}">0 records</span>
</div>
<div class="section-sm" style="max-width:960px;">
  <div class="breadcrumb">
    <a th:href="@{/home}">Home</a><span class="breadcrumb-sep">›</span>
    <a th:href="@{/team/user-module}">User Module</a><span class="breadcrumb-sep">›</span>
    <span th:text="${currentPage != null ? currentPage : 'Purchases'}">Purchases</span>
  </div>
  <div class="result-description animate-in" th:text="${apiDescription}"></div>
  <div class="alert alert-error" th:if="${error != null}"><span>⚠️</span><span th:text="${error}"></span></div>

  <div th:if="${purchases != null and !purchases.isEmpty()}" class="animate-in delay-1">
    <div class="data-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>User ID</th>
            <th>Buyer Name</th>
            <th>Username</th>
            <th>Inventory ID</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${purchases}">
            <td><span style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted-d);" th:text="${p.userId}"></span></td>
            <td>
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4A8FE7,#0ECAB4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;">
                  <span th:text="${p.fullName.trim().length() >= 2 ? #strings.substring(p.fullName.trim(),0,2).toUpperCase() : '??'}">AB</span>
                </div>
                <span th:text="${p.fullName.trim().isEmpty() ? 'Unknown' : p.fullName}">Name</span>
              </div>
            </td>
            <td style="font-family:var(--font-mono);font-size:13px;" th:text="${p.userName}">username</td>
            <td>
              <span style="font-family:var(--font-mono);font-size:13px;background:var(--bg-muted);padding:3px 8px;border-radius:4px;border:1px solid var(--border-light);"
                    th:text="'#' + ${p.inventoryId}">
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="empty-state" th:if="${purchases == null or purchases.isEmpty()}">
    <div class="empty-state-icon">📭</div>
    <h3>No purchases found</h3>
    <p>No purchase records match this query</p>
  </div>
</div>
<footer class="footer"><p>Book Inventory · <a th:href="@{/team/user-module}">← Back to endpoints</a></p></footer>
</body>
</html>
