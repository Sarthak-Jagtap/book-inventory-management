<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Purchase Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="page-header">
  <a class="page-header-back" th:href="@{/team/user-module}">←</a>
  <div><h1>Purchase Check</h1>
    <p><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted-d);" th:text="${apiEndpoint}"></code></p>
  </div>
</div>
<div class="section-sm" style="max-width:700px;">
  <div class="breadcrumb"><a th:href="@{/home}">Home</a><span class="breadcrumb-sep">›</span><a th:href="@{/team/user-module}">User Module</a><span class="breadcrumb-sep">›</span><span>Purchase Check</span></div>
  <div class="result-description animate-in" th:text="${apiDescription}"></div>
  <div class="alert alert-error" th:if="${error != null}"><span>⚠️</span><span th:text="${error}"></span></div>
  <div th:if="${hasPurchased != null}" class="animate-in delay-1">
    <div class="alert" th:classappend="${hasPurchased} ? 'alert-success' : 'alert-info'" style="font-size:15px;padding:16px 20px;">
      <span style="font-size:24px;" th:text="${hasPurchased} ? '✅' : '❌'">✅</span>
      <div>
        <strong th:text="${hasPurchased} ? 'Already Purchased' : 'Not Yet Purchased'">Status</strong><br/>
        <span th:text="'Inventory Item #' + ${inventoryId}"></span>
        <span th:text="${hasPurchased} ? ' has been purchased by this user.' : ' has NOT been purchased by this user.'"></span>
      </div>
    </div>
    <form th:action="@{/user/api/purchase-check}" method="get" style="margin-top:16px;">
      <div style="display:flex;gap:10px;align-items:end;">
        <div class="form-group" style="margin:0;flex:1;">
          <label class="form-label">Try another Inventory ID</label>
          <input class="form-control" type="number" name="inventoryId" th:value="${inventoryId}" min="1"/>
        </div>
        <button type="submit" class="btn btn-primary">Check →</button>
      </div>
    </form>
  </div>
</div>
<footer class="footer"><p>Book Inventory · <a th:href="@{/team/user-module}">← Back to endpoints</a></p></footer>
</body>
</html>
