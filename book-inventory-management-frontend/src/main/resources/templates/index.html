<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Inventory System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fc;--surface:#fff;--surface2:#f0f2f8;--text:#1a1d2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --accent:#6366f1;--accent2:#818cf8;--accent-hover:#4f46e5;
}
body.dark{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#252840;--text:#e8eaf6;--text2:#9ca3af;--text3:#6b7280;
  --border:#2d3148;--border2:#3d4165;
  --accent:#818cf8;--accent2:#a5b4fc;--accent-hover:#6366f1;
}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  transition:background .3s,color .3s;
  min-height:100vh;display:flex;flex-direction:column;
}

/* ── Topbar ── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:32px;height:32px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.logo-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.logo-title{font-size:15px;font-weight:600;color:var(--text)}

.btn-dark{
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;transition:all .2s;
}
.btn-dark:hover{border-color:var(--accent);color:var(--accent)}

/* ── Main Layout ── */
.container{
  max-width:800px;margin:60px auto;padding:0 32px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.hero h1{font-size:36px;font-weight:800;color:var(--text);margin-bottom:12px;letter-spacing:-0.5px}
.hero p{font-size:16px;color:var(--text2);line-height:1.6;max-width:500px;margin:0 auto 40px}

/* ── Team Section ── */
.section-title{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  color:var(--text3);margin-bottom:20px;
}
.team-grid{
  display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:48px;
}
.member-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:24px;width:240px;
  box-shadow:0 10px 25px -5px rgba(0,0,0,.02);
  transition:transform .2s,border-color .2s;
}
.member-card:hover{transform:translateY(-4px);border-color:var(--border2)}
.member-photo{
  width:80px;height:80px;border-radius:50%;margin:0 auto 16px;
  background:var(--surface2);display:flex;align-items:center;justify-content:center;
  overflow:hidden;border:2px solid var(--border);
}
.member-photo img { width:100%;height:100%;object-fit:cover; }
.member-photo svg { width:40px;height:40px;fill:var(--text3) }
.member-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.member-role{font-size:13px;color:var(--accent);font-weight:500}

/* ── CTA Button ── */
.btn-primary{
  background:var(--accent);color:#fff;text-decoration:none;
  padding:14px 28px;border-radius:12px;font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;
  transition:background .2s,transform .1s;
  box-shadow:0 4px 12px rgba(99,102,241,.2);
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:active{transform:scale(.97)}
.btn-primary svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5}

@media(max-width:600px){
  .container{margin:40px auto;padding:0 20px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body class="dark">

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div class="logo-title">Book Inventory System</div>
  </div>
  <button class="btn-dark" onclick="toggleDark()">
    <span id="dark-icon">☀️</span>
  </button>
</div>

<div class="container">
  
  <div class="hero">
    <h1>Welcome to the System</h1>
    <p>A robust backend architecture for managing authors, books, and inventory mappings seamlessly.</p>
  </div>

  <div class="section-title">Development Team</div>
  <div class="team-grid">
    
    <div class="member-card">
      <div class="member-photo">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="member-name">Sudhanshu Lawhare</div>
      <div class="member-role">Lead Developer</div>
    </div>
    
    </div>

  <a th:href="@{/api-author-dashboard}" class="btn-primary">
    Launch API Dashboard
    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </a>
  <form action="http://localhost:8080/api/v1/authors" method="get">

  <button class="run-btn">
  Run
  </button>

  </form>
</div>

<script>
// Theme Initialization
document.addEventListener('DOMContentLoaded', (event) => {
  const savedTheme = localStorage.getItem('theme');
  if(savedTheme === 'light') {
    document.body.classList.remove('dark');
    document.getElementById('dark-icon').textContent = '🌙';
  } else {
    document.body.classList.add('dark');
    document.getElementById('dark-icon').textContent = '☀️';
  }
});

// Theme Toggle Function
function toggleDark() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('dark-icon').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
</script>

</body>
</html>
