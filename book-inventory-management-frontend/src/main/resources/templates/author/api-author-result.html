<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Result Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fc;--surface:#fff;--surface2:#f0f2f8;--text:#1a1d2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --success-bg:#dcfce7;--success-text:#166534;
  --error-bg:#fee2e2;--error-text:#b91c1c;
  --accent:#6366f1;--accent2:#818cf8;
}
body.dark{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#252840;--text:#e8eaf6;--text2:#9ca3af;--text3:#6b7280;
  --border:#2d3148;--border2:#3d4165;
  --success-bg:#052e16;--success-text:#4ade80;
  --error-bg:#3f0708;--error-text:#fca5a5;
  --accent:#818cf8;--accent2:#a5b4fc;
}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  transition:background .3s,color .3s;
  padding:0 0 60px;
}

/* ── Topbar ── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:32px;height:32px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.logo-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.logo-title{font-size:15px;font-weight:600;color:var(--text)}
.logo-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.topbar-actions{display:flex;align-items:center;gap:12px}

.btn-dark, .btn-back{
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;transition:all .2s;text-decoration:none;
}
.btn-dark:hover, .btn-back:hover{border-color:var(--accent);color:var(--accent)}

/* ── Content Layout ── */
.container{max-width:1000px;margin:40px auto;padding:0 32px;display:flex;flex-direction:column;gap:24px}

/* ── Cards ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.02);
}
.card-header{
  padding:16px 24px;border-bottom:1px solid var(--border);
  font-weight:600;font-size:14px;color:var(--text);
  display:flex;align-items:center;justify-content:space-between;
}
.card-body{padding:24px}

/* ── Status Header ── */
.status-row{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.status-badge{
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
}
.status-success{background:var(--success-bg);color:var(--success-text)}
.status-error{background:var(--error-bg);color:var(--error-text)}
.message-text{font-size:15px;color:var(--text2);line-height:1.5}

/* ── Tables ── */
.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th{
  background:var(--surface2);color:var(--text3);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;font-size:11px;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

.empty-state{color:var(--text3);font-size:13px;font-style:italic}

/* ── Code Block ── */
.json-block{
  background:#1a1d2e;color:#c7d2fe;padding:20px;border-radius:8px;
  font-family:'Courier New',monospace;font-size:13px;
  overflow-x:auto;white-space:pre-wrap;border:1px solid #2d3148;line-height:1.7;
}

@media(max-width:600px){
  .topbar{padding:12px 16px} .container{padding:0 16px;margin:24px auto}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
    </div>
    <div>
      <div class="logo-title">API Response</div>
      <div class="logo-sub">Execution Viewer</div>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="/api-author-dashboard" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Dashboard
    </a>
    <button class="btn-dark" onclick="toggleDark()">
      <span id="dark-icon">🌙</span>
    </button>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="card-body">
      <div class="status-row">
        <span class="status-badge" 
              th:classappend="${response?.success} ? 'status-success' : 'status-error'"
              th:text="${response?.success} ? 'SUCCESS' : 'ERROR'">
        </span>
      </div>
      <div class="message-text">
        <strong style="color:var(--text)">Message:</strong> 
        <span th:text="${response?.message}">No message provided</span>
      </div>
    </div>
  </div>

  <div class="card" th:if="${response?.data != null}">
    <div class="card-header">Parsed Data</div>
    <div class="card-body" style="padding:0">
      <div class="table-responsive">
        
        <table th:if="${response?.data instanceof T(java.util.List) and not #lists.isEmpty(response?.data)}">
          <thead>
            <tr>
              <th th:each="key : ${response?.data[0].keySet()}" th:text="${key}"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="row : ${response?.data}">
              <td th:each="val : ${row.values()}" th:text="${val}"></td>
            </tr>
          </tbody>
        </table>

        <div th:if="${response?.data instanceof T(java.util.List) and #lists.isEmpty(response?.data)}" style="padding:24px">
          <span class="empty-state">The result set is empty (0 records found).</span>
        </div>

        <table th:if="${response?.data instanceof T(java.util.Map)}">
          <thead>
            <tr>
              <th style="width: 30%">Field</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="entry : ${response?.data.entrySet()}">
              <td style="font-family:monospace;color:var(--accent)" th:text="${entry.key}"></td>
              <td th:text="${entry.value}"></td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Raw Response Object</div>
    <div class="card-body">
      <div class="json-block" th:text="${response}"></div>
    </div>
  </div>

</div>

<script>
// Check local storage so the theme persists when moving from dashboard to result page!
// Check local storage. Default to DARK unless explicitly set to 'light'
document.addEventListener('DOMContentLoaded', (event) => {
  const savedTheme = localStorage.getItem('theme');
  
  if(savedTheme === 'light') {
    // User explicitly wanted light mode
    document.body.classList.remove('dark');
    document.getElementById('dark-icon').textContent = '🌙';
    // For the dashboard, also update the text label
    const darkLabel = document.getElementById('dark-label');
    if(darkLabel) darkLabel.textContent = 'Dark mode'; 
  } else {
    // First visit OR user explicitly wanted dark mode
    document.body.classList.add('dark');
    document.getElementById('dark-icon').textContent = '☀️';
    // For the dashboard, also update the text label
    const darkLabel = document.getElementById('dark-label');
    if(darkLabel) darkLabel.textContent = 'Light mode';
  }
});

function toggleDark() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  
  document.getElementById('dark-icon').textContent = isDark ? '☀️' : '🌙';
  
  const darkLabel = document.getElementById('dark-label');
  if(darkLabel) darkLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
  
  // Save preference
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
</script>

</body>
</html>
