<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authors | Book Inventory System</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<style>
/* ── Authors List Page ─────────────────────────────────────── */
.author-info        { display: flex; align-items: center; gap: 14px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--surface2); display: flex; align-items: center;
  justify-content: center; overflow: hidden;
  border: 1.5px solid var(--border); flex-shrink: 0;
}
.avatar img         { width: 100%; height: 100%; object-fit: cover; }
.avatar svg         { width: 18px; height: 18px; fill: var(--text3); }
.author-name        { font-weight: 600; color: var(--text); font-size: 14px; }
.id-badge {
  display: inline-block; font-family: monospace; font-size: 12px;
  font-weight: 600; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  padding: 2px 8px; border-radius: 5px;
}
.action-cell        { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }

/* Search row */
.search-row         { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search-row .search-input { flex: 1; min-width: 200px; }

/* Results meta */
.results-meta {
  font-size: 13px; color: var(--text3); padding: 0 2px 8px;
}

/* Empty state */
.empty-state {
  padding: 56px 20px; text-align: center; color: var(--text2); font-size: 14px;
}
.empty-state svg    { display: block; margin: 0 auto 12px; opacity: .35; }
</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-wrapper">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1>Authors</h1>
      <p>Manage the authors catalog in your inventory.</p>
    </div>
    <a th:href="@{/store-owner/authors/new}" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add New Author
    </a>
  </div>

  <!-- Search Bar -->
  <div class="card" style="padding: 16px 20px; margin-bottom: 20px;">
    <form th:action="@{/authors}" method="get" class="search-row">
      <input type="text" name="name" class="search-input form-control"
             placeholder="&#128269; Search by author name…"
             th:value="${searchQuery}" style="max-width:360px;">
      <button type="submit" class="btn btn-primary">Search</button>
      <a th:if="${searchQuery != null and !searchQuery.isEmpty()}"
         th:href="@{/authors}" class="btn btn-secondary">Clear</a>
    </form>
  </div>

  <!-- Alerts -->
  <div th:if="${param.success}" class="alert alert-success" th:text="${param.success}">Action successful</div>
  <div th:if="${error}"         class="alert alert-danger"  th:text="${error}">An error occurred</div>

  <!-- Table Card -->
  <div class="card" style="padding: 0; overflow: hidden;">

    <!-- Results count bar -->
    <div th:if="${authors != null and !#lists.isEmpty(authors)}"
         style="padding: 14px 20px 0; display:flex; align-items:center; justify-content:space-between;">
      <p class="results-meta">
        Showing <strong th:text="${#lists.size(authors)}">0</strong> author(s)
        <th:block th:if="${searchQuery != null and !searchQuery.isEmpty()}">
          for "<em th:text="${searchQuery}"></em>"
        </th:block>
      </p>
    </div>

    <div class="data-table-wrapper">
      <table class="data-table" th:if="${authors != null and !#lists.isEmpty(authors)}">
        <thead>
          <tr>
            <th style="width:90px; padding-left:20px;">ID</th>
            <th style="padding-left:8px;">Author</th>
            <th style="width:140px; text-align:right; padding-right:20px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="author : ${authors}">

            <td style="padding-left:20px;">
              <span class="id-badge" th:text="'#' + ${author.authorID}">#1</span>
            </td>

            <td style="padding: 12px 16px;">
              <div class="author-info">
                <div class="avatar">
                  <img th:if="${author.photo != null and !author.photo.isEmpty()}"
                       th:src="${author.photo}" alt="Photo">
                  <svg th:unless="${author.photo != null and !author.photo.isEmpty()}"
                       viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </div>
                <div>
                  <div class="author-name"
                       th:text="${author.firstName + ' ' + author.lastName}">John Doe</div>
                </div>
              </div>
            </td>

            <td style="text-align:right; padding-right:20px;">
              <div class="action-cell">
                <a th:href="@{/authors/{id}(id=${author.authorID})}"
                   class="btn btn-sm btn-secondary">View</a>
                <a th:href="@{/store-owner/authors/{id}/edit(id=${author.authorID})}"
                   class="btn btn-sm btn-secondary">Edit</a>
                <form th:action="@{/store-owner/authors/{id}/delete(id=${author.authorID})}"
                      method="post" style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this author? This action cannot be undone.');">
                  <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
              </div>
            </td>

          </tr>
        </tbody>
      </table>

      <!-- Empty State -->
      <div th:if="${authors == null or #lists.isEmpty(authors)}" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--border2)">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        </svg>
        <p style="font-weight:600; margin-bottom:4px;">No authors found</p>
        <p style="font-size:13px;">Try adjusting your search or
          <a th:href="@{/store-owner/authors/new}" style="color:var(--accent);">add a new author</a>.
        </p>
      </div>

    </div>
  </div>

</div>

</body>
</html>
