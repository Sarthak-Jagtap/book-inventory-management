<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authors | Book Inventory System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fc;--surface:#fff;--surface2:#f0f2f8;--text:#1a1d2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --success-bg:#dcfce7;--success-text:#166534;
  --error-bg:#fee2e2;--error-text:#b91c1c;
  --accent:#6366f1;--accent2:#818cf8;--accent-hover:#4f46e5;
  --danger:#ef4444;--danger-hover:#dc2626;
}
body.dark{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#252840;--text:#e8eaf6;--text2:#9ca3af;--text3:#6b7280;
  --border:#2d3148;--border2:#3d4165;
  --success-bg:#052e16;--success-text:#4ade80;
  --error-bg:#3f0708;--error-text:#fca5a5;
  --accent:#818cf8;--accent2:#a5b4fc;--accent-hover:#6366f1;
}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  transition:background .3s,color .3s;
  padding:0 0 60px;
}

/* ── Topbar ── */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{
  width:32px;height:32px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.logo-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.logo-title{font-size:15px;font-weight:600;color:var(--text)}

.topbar-actions{display:flex;align-items:center;gap:12px}
.btn-dark{
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;transition:all .2s;
}
.btn-dark:hover{border-color:var(--accent);color:var(--accent)}

/* ── Layout ── */
.container{max-width:1000px;margin:40px auto;padding:0 32px;display:flex;flex-direction:column;gap:24px}

/* ── Page Header ── */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.page-title h1{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.page-title p{font-size:14px;color:var(--text2);margin-top:4px}

/* ── Buttons ── */
.btn{
  text-decoration:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:none;transition:all .2s;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}

/* ── Search Bar ── */
.search-form{display:flex;gap:10px;width:100%;max-width:400px}
.search-input{
  flex:1;background:var(--surface);border:1px solid var(--border2);
  color:var(--text);font-size:14px;padding:10px 16px;border-radius:8px;
  outline:none;transition:border-color .2s;
}
.search-input:focus{border-color:var(--accent)}

/* ── Alerts ── */
.alert{padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;margin-bottom:8px}
.alert-success{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success-text)}
.alert-danger{background:var(--error-bg);color:var(--error-text);border:1px solid var(--error-text)}

/* ── Card & Table ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.02);
}
.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th{
  background:var(--surface2);color:var(--text3);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;font-size:11px;
  padding:14px 20px;border-bottom:1px solid var(--border);
}
td{padding:14px 20px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

.author-info{display:flex;align-items:center;gap:12px}
.avatar{
  width:40px;height:40px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:1px solid var(--border);flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:20px;height:20px;fill:var(--text3)}
.name-text{font-weight:600;color:var(--text)}
.id-text{font-family:monospace;font-size:12px;color:var(--text3)}

.action-cell{display:flex;gap:8px;align-items:center}
.empty-state{padding:40px;text-align:center;color:var(--text2);font-size:14px}

@media(max-width:600px){
  .topbar{padding:12px 16px}
  .container{padding:0 16px;margin:24px auto}
  .search-form{max-width:100%}
}
</style>
</head>
<body class="dark">

<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div class="logo-title">Book Inventory System</div>
  </a>
  <div class="topbar-actions">
    <button class="btn-dark" onclick="toggleDark()">
      <span id="dark-icon">☀️</span>
    </button>
  </div>
</div>

<div class="container">

  <div class="page-header">
    <div class="page-title">
      <h1>Authors</h1>
      <p>Manage the authors catalog in your inventory.</p>
    </div>
    <a th:href="@{/store-owner/authors/new}" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Add New Author
    </a>
  </div>

  <div class="page-header">
    <form th:action="@{/authors}" method="get" class="search-form">
      <input type="text" name="name" class="search-input" placeholder="Search by name..." th:value="${searchQuery}">
      <button type="submit" class="btn btn-outline">Search</button>
      <a th:if="${searchQuery != null and !searchQuery.isEmpty()}" th:href="@{/authors}" class="btn btn-outline">Clear</a>
    </form>
  </div>

  <div th:if="${param.success}" class="alert alert-success" th:text="${param.success}">Action successful</div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}">An error occurred</div>

  <div class="card">
    <div class="table-responsive">
      <table th:if="${authors != null and !#lists.isEmpty(authors)}">
        <thead>
          <tr>
            <th style="width:80px">ID</th>
            <th>Author Details</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="author : ${authors}">
            
            <td class="id-text" th:text="'#' + ${author.authorID}">#1</td>
            
            <td>
              <div class="author-info">
                <div class="avatar">
                  <img th:if="${author.photo != null and !author.photo.isEmpty()}" th:src="${author.photo}" alt="Photo">
                  <svg th:unless="${author.photo != null and !author.photo.isEmpty()}" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div>
                  <div class="name-text" th:text="${author.firstName + ' ' + author.lastName}">John Doe</div>
                </div>
              </div>
            </td>
            
            <td style="text-align:right">
              <div class="action-cell" style="justify-content:flex-end">
                <a th:href="@{/authors/{id}(id=${author.authorID})}" class="btn btn-sm btn-outline">View</a>
                <a th:href="@{/store-owner/authors/{id}/edit(id=${author.authorID})}" class="btn btn-sm btn-outline">Edit</a>
                
                <form th:action="@{/store-owner/authors/{id}/delete(id=${author.authorID})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this author? This action cannot be undone.');">
                  <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
              </div>
            </td>

          </tr>
        </tbody>
      </table>

      <div th:if="${authors == null or #lists.isEmpty(authors)}" class="empty-state">
        <svg style="width:48px;height:48px;fill:var(--border2);margin-bottom:12px" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        <p>No authors found. Try adjusting your search or add a new author.</p>
      </div>

    </div>
  </div>

</div>

<script>
// Standard Theme Toggle Logic
document.addEventListener('DOMContentLoaded', (event) => {
  const savedTheme = localStorage.getItem('theme');
  if(savedTheme === 'light') {
    document.body.classList.remove('dark');
    document.getElementById('dark-icon').textContent = '🌙';
  } else {
    document.body.classList.add('dark');
    document.getElementById('dark-icon').textContent = '☀️';
  }
});

function toggleDark() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('dark-icon').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
</script>

</body>
</html>
