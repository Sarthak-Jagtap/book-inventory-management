<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Authors | Book Inventory System</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<style>
/* ── Book-Profile (Assigned Authors) ─────────────────────── */
.badge-primary {
  display: inline-block;
  background: #fef9c3; color: #92400e;
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
  border: 1px solid #fde68a;
  white-space: nowrap;
}
.badge-coauthor {
  display: inline-block;
  background: var(--surface2); color: var(--text3);
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  border: 1px solid var(--border);
}
.action-cell { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.author-id-cell {
  font-family: monospace; font-size: 13px; font-weight: 700;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}
.empty-state {
  padding: 56px 20px; text-align: center; color: var(--text2); font-size: 14px;
}
</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-wrapper-sm">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">
      <h1>Assigned Authors</h1>
      <p>
        <span style="font-size:13px; color:var(--text3);">Book ISBN: </span>
        <code style="font-size:13px; color:var(--accent); font-weight:600;" th:text="${isbn}">000-000</code>
      </p>
    </div>
    <a th:href="@{/store-owner/book-authors/new(isbn=${isbn})}" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Assign Author
    </a>
  </div>

  <!-- Alerts -->
  <div th:if="${param.success}" class="alert alert-success" th:text="${param.success}">Action successful</div>
  <div th:if="${param.error}"   class="alert alert-danger"  th:text="${param.error}">An error occurred</div>

  <!-- Table Card -->
  <div class="card" style="padding: 0; overflow: hidden;">

    <!-- Card header -->
    <div style="padding: 14px 20px 12px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div style="font-size:15px; font-weight:700; color:var(--text);">Author Mappings</div>
        <div style="font-size:12px; color:var(--text3); margin-top:2px;">Authors linked to this book and their roles</div>
      </div>
    </div>

    <div style="overflow-x: auto;">
      <table class="data-table" style="min-width:480px;"
             th:if="${bookAuthors != null and !#lists.isEmpty(bookAuthors)}">
        <thead>
          <tr>
            <th style="width:140px; padding-left:20px;">Author ID</th>
            <th style="width:180px;">Role</th>
            <th style="text-align:right; padding-right:20px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="mapping : ${bookAuthors}">

            <td style="padding-left:20px; padding-top:14px; padding-bottom:14px;">
              <span class="author-id-cell"
                    th:text="'#' + ${mapping.get('id') != null ? mapping.get('id').get('authorID') : 'N/A'}">
              </span>
            </td>

            <td>
              <span th:if="${mapping.get('primaryAuthor') == 'Y'}" class="badge-primary">⭐ Primary Author</span>
              <span th:if="${mapping.get('primaryAuthor') == 'N'}" class="badge-coauthor">Co-Author</span>
            </td>

            <td style="text-align:right; padding-right:20px;">
              <div class="action-cell">
                <a th:href="@{/store-owner/book-authors/{isbn}/{id}/edit(isbn=${isbn}, id=${mapping.get('id') != null ? mapping.get('id').get('authorID') : ''})}"
                   class="btn btn-sm btn-secondary">Edit Role</a>

                <form th:action="@{/store-owner/book-authors/{isbn}/{id}/delete(isbn=${isbn}, id=${mapping.get('id') != null ? mapping.get('id').get('authorID') : ''})}"
                      method="post" style="display:inline;"
                      onsubmit="return confirm('Remove this author from the book?');">
                  <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                </form>
              </div>
            </td>

          </tr>
        </tbody>
      </table>

      <!-- Empty state -->
      <div th:if="${bookAuthors == null or #lists.isEmpty(bookAuthors)}" class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--border2)"
             stroke-width="1.5" style="margin:0 auto 12px;display:block;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <p style="font-weight:600; margin-bottom:4px;">No authors assigned</p>
        <p style="font-size:13px; color:var(--text3);">No authors have been assigned to this book yet.</p>
      </div>
    </div>

  </div>

</div>

</body>
</html>
