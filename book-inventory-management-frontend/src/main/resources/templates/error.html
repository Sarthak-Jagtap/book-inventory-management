<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div style="min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div style="text-align:center;max-width:400px;">
    <div style="font-size:40px;margin-bottom:12px;">⚠</div>
    <h2 style="font-size:20px;font-weight:600;margin-bottom:8px;">Something went wrong</h2>
    <p class="text-muted" style="margin-bottom:20px;" th:text="${errorMessage!=null?errorMessage:'An unexpected error occurred.'}">Error</p>
    <div style="display:flex;gap:8px;justify-content:center;">
      <a class="btn btn-primary btn-sm" th:href="@{/home}">Go Home</a>
      <button class="btn btn-secondary btn-sm" onclick="history.back()">Go Back</button>
    </div>
  </div>
</div>
<div class="footer">Book Inventory Management</div>
</body></html>
