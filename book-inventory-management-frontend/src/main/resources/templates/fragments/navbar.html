<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">

<nav class="navbar" th:fragment="navbar">

  <a class="navbar-brand" th:href="@{/home}">Book<span>Inventory</span></a>

  <!-- Nav links — session based (not sec:authorize) -->
  <th:block th:if="${session.JWT_TOKEN != null}">
    <a class="nav-link" th:href="@{/home}"
       th:classappend="${activePage=='home'}?'active'">Home</a>
    <!-- My APIs REMOVED — users go via team cards on home page -->
    <a class="nav-link" th:href="@{/user/api/profile}"
       th:classappend="${activePage=='profile'}?'active'">Profile</a>
    <a class="nav-link" th:href="@{/user/api/dashboard}"
       th:classappend="${activePage=='dashboard'}?'active'">Dashboard</a>
  </th:block>

  <th:block th:if="${session.ROLE_NAME == 'StoreOwner' or session.ROLE_NAME == 'Admin'}">
    <a class="nav-link" th:href="@{/user/api/store-owner/purchases}"
       th:classappend="${activePage=='store'}?'active'">Store</a>
  </th:block>

  <th:block th:if="${session.ROLE_NAME == 'Admin'}">
    <a class="nav-link" th:href="@{/user/api/admin/users}"
       th:classappend="${activePage=='admin'}?'active'">Admin</a>
  </th:block>

  <div class="navbar-right">

    <!-- Not logged in -->
    <th:block th:if="${session.JWT_TOKEN == null}">
      <a class="btn btn-secondary btn-sm" th:href="@{/auth/login}">Login</a>
      <a class="btn btn-primary btn-sm"   th:href="@{/auth/register}">Register</a>
    </th:block>

    <!-- Logged in -->
    <th:block th:if="${session.JWT_TOKEN != null}">
      <div class="nav-user-info">
        <span th:text="${session.USER_NAME}">username</span>
        <span class="role-tag" th:text="${session.ROLE_NAME}">Role</span>
      </div>
      <!-- Logout as POST form (CSRF) -->
      <form th:action="@{/auth/logout}" method="post" style="display:inline;margin:0;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
      </form>
    </th:block>

  </div>
</nav>

</html>
