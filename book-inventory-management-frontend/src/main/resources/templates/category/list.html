<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Categories List</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Book Categories</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Manage types and genres for the inventory
				</div>
			</div>
			<div style="display: flex; gap: 8px;">
				<a class="btn btn-secondary btn-sm" th:href="@{/categories/summary}">View Summary</a>
				<a class="btn btn-primary btn-sm" th:href="@{/categories/add}">+ Add Category</a>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>
			</div>
			
		</div>

		<div class="card">
			<table class="table" style="width:100%; border-collapse:collapse;">
				<thead style="background-color: #f9fafb; border-bottom: 1px solid #e5e7eb;">
					<tr>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							ID</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Category Description</th>
						<th
							style="padding: 12px 16px; text-align: right; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Actions</th>
					</tr>
				</thead>
				<tbody style="font-size: 14px; color: #374151;">
					<tr th:each="cat : ${categories}" style="border-bottom: 1px solid #f3f4f6;">
						<td style="padding: 12px 16px; font-weight: 600;" th:text="${cat.categoryId}"></td>
						<td style="padding: 12px 16px;" th:text="${cat.categoryDescription}"></td>
						<td
							style="padding: 12px 16px; text-align: right; display: flex; justify-content: flex-end; gap: 8px;">
							<a th:href="@{/categories/details(categoryId=${cat.categoryId})}"
								class="btn btn-secondary btn-sm" style="padding: 4px 8px;">View</a>
							<a th:href="@{/categories/update(categoryId=${cat.categoryId})}"
								class="btn btn-primary btn-sm" style="padding: 4px 8px;">Edit</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
