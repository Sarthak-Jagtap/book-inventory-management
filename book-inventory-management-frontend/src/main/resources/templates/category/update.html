<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Update Category</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Update Category</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Modify existing classification details</div>
			</div>
			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/categories/list}">← Cancel</a>
			</div>

		</div>

		<div class="card" style="padding: 24px; max-width: 500px;">
			<!-- Controller uses @RequestParam, so we use plain name attributes -->
			<form th:action="@{/categories/update}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div style="margin-bottom: 16px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Category
						ID</label>
					<input type="number" name="categoryId" th:value="${param.categoryId}" readonly
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background-color: #f3f4f6; color: #6b7280; cursor: not-allowed;">
					<small style="color: #6b7280; font-size: 12px;">ID cannot be changed during update.</small>
				</div>

				<div style="margin-bottom: 24px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">New
						Description</label>
					<input type="text" name="categoryDescription" required
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;"
						placeholder="e.g. Science Fiction">
				</div>

				<button type="submit" class="btn btn-primary">Save Changes</button>
			</form>
		</div>
	</div>
</body>

</html>
