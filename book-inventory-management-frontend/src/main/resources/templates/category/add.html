<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Add Category</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Create New Category</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Add a new classification for books</div>
			</div>

			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/categories/list}">← Back to List</a>
			</div>
		</div>

		<div class="card" style="padding: 24px; max-width: 500px;">
			<form th:action="@{/categories/add}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div style="margin-bottom: 16px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Category
						ID</label>
					<input type="number" name="categoryId" required class="form-control"
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;"
						placeholder="e.g. 101">
				</div>

				<div style="margin-bottom: 24px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Description</label>
					<input type="text" name="categoryDescription" required class="form-control"
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;"
						placeholder="e.g. Science Fiction">
				</div>

				<button type="submit" class="btn btn-primary">Create Category</button>
			</form>
		</div>
	</div>
</body>

</html>
