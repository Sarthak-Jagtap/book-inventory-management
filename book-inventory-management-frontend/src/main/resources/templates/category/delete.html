<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Delete Category</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#dc2626;">Delete Category</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Permanent removal of a category</div>
			</div>

			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/categories/list}">← Back to List</a>
			</div>
		</div>

		<div class="card" style="padding: 24px; max-width: 500px; border-top: 4px solid #ef4444;">
			<p style="color: #4b5563; font-size: 14px; margin-bottom: 20px;">
				Warning: Deleting a category may affect books linked to it. Please confirm the Category ID below.
			</p>

			<form th:action="@{/categories/delete}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<div style="margin-bottom: 24px;">
					<label
						style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px;">Category
						ID</label>
					<input type="number" name="categoryId" th:value="${param.categoryId}" required
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;"
						placeholder="Confirm ID to delete">
				</div>

				<div style="display: flex; gap: 12px;">
					<button type="submit" class="btn btn-danger"
						onclick="return confirm('Are you sure you want to delete this category?');">Delete
						Permanently</button>
					<a th:href="@{/categories/list}" class="btn btn-secondary">Cancel</a>
				</div>
			</form>
		</div>
	</div>
</body>

</html>
