<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Book Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" th:href="@{/home}">Book<span>Inventory</span></a>
  <div class="navbar-right">
    <a class="btn btn-secondary btn-sm" th:href="@{/home}">← Back to Home</a>
  </div>
</nav>

<div class="form-page" style="align-items:flex-start;padding-top:32px;">
  <div class="form-box" style="max-width:480px;">

    <h2>Register</h2>
    <p class="sub">Create a new account</p>

    <div class="alert alert-error" th:if="${error != null}">
      <span>⚠</span> <span th:text="${error}">Error</span>
    </div>

    <form th:action="@{/auth/do-register}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input class="form-control" type="text" name="firstName"
                 th:value="${firstName}" placeholder="First name" maxlength="20" required autofocus/>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input class="form-control" type="text" name="lastName"
                 th:value="${lastName}" placeholder="Last name" maxlength="30" required/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="userName"
               th:value="${userName}" placeholder="Choose a unique username"
               maxlength="30" required/>
        <div class="form-hint">Max 30 characters, must be unique</div>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number <span class="text-muted">(optional)</span></label>
        <input class="form-control" type="tel" name="phoneNumber"
               th:value="${phoneNumber}" placeholder="(123) 456-7890"/>
        <div class="form-hint">Format: (XXX) XXX-XXXX</div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password"
               placeholder="Min 4 characters" minlength="4" maxlength="30" required/>
      </div>

      <!-- Role dropdown if roles available -->
      <div class="form-group" th:if="${roles != null and !roles.isEmpty()}">
        <label class="form-label">Role <span class="text-muted">(optional)</span></label>
        <select class="form-control" name="roleNumber">
          <option value="">Default — RegisteredUser</option>
          <option th:each="r : ${roles}" th:value="${r.roleNumber}" th:text="${r.permRole}">Role</option>
        </select>
      </div>

      <div class="mt-2">
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </div>
    </form>

    <p class="form-footer">Already have an account? <a th:href="@{/auth/login}">Login here</a></p>
  </div>
</div>

</body>
</html>
