<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory List</title>
  <link rel="stylesheet" th:href="@{/css/api-dashboard.css}">
  <style>
    .error-box{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:14px 16px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}
    .success-box{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:14px 16px;border-radius:10px;margin-bottom:16px;}
    .footer-actions {margin-top: 30px;padding-top: 20px;border-top: 1px solid var(--border);display: flex;justify-content: center;}
    .sort-icon { cursor: pointer; margin-left: 5px; opacity: 0.6; }
    .sort-icon:hover { opacity: 1; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div>
      <div class="logo-title">Book Inventory API</div>
      <div class="logo-sub">Inventory Management</div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-text">
    <h1>Inventory Catalog</h1>
    <p>View and manage all physical book copies in the system.</p>
  </div>
</div>

<div class="content">
  <div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>
  <div th:if="${successMessage != null}" class="success-box" th:text="${successMessage}"></div>

  <div class="table-wrap">
    <table class="data-table" id="inventoryTable">
      <thead>
      <tr>
        <th onclick="sortTable(0)">Inventory ID <span class="sort-icon">↕</span></th>
        <th onclick="sortTable(1)">ISBN <span class="sort-icon">↕</span></th>
        <th onclick="sortTable(2)">Rank <span class="sort-icon">↕</span></th>
        <th onclick="sortTable(3)">Status <span class="sort-icon">↕</span></th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${inventoryList}">
        <td th:text="${item.inventoryId}"></td>
        <td th:text="${item.isbn}"></td>
        <td th:text="${item.rank}"></td>
        <td>
          <span th:if="${item.purchased}" class="pill pill-no">SOLD</span>
          <span th:unless="${item.purchased}" class="pill pill-yes">AVAILABLE</span>
        </td>
        <td>
          <div class="mini-actions">
            <a class="btn btn-primary" th:href="@{/store-owner/inventory/edit/{id}(id=${item.inventoryId})}">Edit</a>
            <form th:action="@{/store-owner/inventory/delete/{id}(id=${item.inventoryId})}"
                  method="post"
                  onsubmit="return confirm('Permanently remove this item from inventory?');"
                  style="display:inline;">
              <button class="btn btn-danger" type="submit">Delete</button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${inventoryList == null or #lists.isEmpty(inventoryList)}" class="empty-state">
    No inventory items found.
  </div>

  <div class="footer-actions">
    <a class="btn btn-secondary" th:href="@{/team/inventory-module}">Back to Dashboard</a>
  </div>
</div>

<script>
function sortTable(n) {
  var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
  table = document.getElementById("inventoryTable");
  switching = true;
  dir = "asc";
  while (switching) {
    switching = false;
    rows = table.rows;
    for (i = 1; i < (rows.length - 1); i++) {
      shouldSwitch = false;
      x = rows[i].getElementsByTagName("TD")[n];
      y = rows[i + 1].getElementsByTagName("TD")[n];
      if (dir == "asc") {
        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
          shouldSwitch = true;
          break;
        }
      } else if (dir == "desc") {
        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
          shouldSwitch = true;
          break;
        }
      }
    }
    if (shouldSwitch) {
      rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
      switching = true;
      switchcount ++;
    } else {
      if (switchcount == 0 && dir == "asc") {
        dir = "desc";
        switching = true;
      }
    }
  }
}
</script>

</body>
</html>
