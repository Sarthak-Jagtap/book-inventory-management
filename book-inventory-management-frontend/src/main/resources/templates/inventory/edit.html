<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Inventory Record</title>
  <link rel="stylesheet" th:href="@{/css/api-dashboard.css}">
  <style>
    .error-box{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:14px 16px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}
    .field-error{color:#b91c1c;font-size:12px;margin-top:4px;}
    .footer-actions {margin-top: 30px;padding-top: 20px;border-top: 1px solid var(--border);display: flex;justify-content: center;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div>
      <div class="logo-title">Book Inventory API</div>
      <div class="logo-sub">Store Owner Panel</div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-text">
    <h1>Modify Record</h1>
    <p>Update the quality rank for an existing inventory item in the system.</p>
  </div>
</div>

<div class="content">
  <div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>

  <div class="form-card">
    <div class="form-title">Edit Inventory Record</div>
    <div class="form-subtitle">Updating Record ID: <strong th:text="${inventoryId}">0</strong></div>

    <form th:action="@{/store-owner/inventory/edit/{id}(id=${inventoryId})}" th:object="${updateInventoryRequest}" method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label" for="rank">Quality Rank (1-6)</label>
          <input class="form-input"
                 id="rank"
                 type="number"
                 min="1"
                 max="6"
                 th:field="*{rank}"
                 placeholder="e.g. 3"
                 required>
          <div class="field-error" th:if="${#fields.hasErrors('rank')}" th:errors="*{rank}"></div>
          <small class="form-hint">Refer to Group 1 for rank descriptions.</small>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Apply Changes</button>
        <a class="btn btn-secondary" th:href="@{/store-owner/inventory}">Cancel</a>
      </div>
    </form>
  </div>

  <div class="footer-actions">
    <a class="btn btn-secondary" th:href="@{/team/inventory-module}">Back to Dashboard</a>
  </div>
</div>
</body>
</html>
