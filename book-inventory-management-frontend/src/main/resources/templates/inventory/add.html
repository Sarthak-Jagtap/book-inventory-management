<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Inventory Item</title>
  <link rel="stylesheet" th:href="@{/css/api-dashboard.css}">
  <style>
    .error-box{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:14px 16px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}
    .success-box{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:14px 16px;border-radius:10px;margin-bottom:16px;}
    .field-error{color:#b91c1c;font-size:12px;margin-top:4px;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <div>
      <div class="logo-title">Book Inventory API</div>
      <div class="logo-sub">Store Owner Panel</div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-text">
    <h1>Create Inventory Record</h1>
    <p>Add a new physical copy of a book to your store's inventory database.</p>
  </div>
</div>

<div class="content">
  <div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>
  <div th:if="${successMessage != null}" class="success-box" th:text="${successMessage}"></div>

  <div class="form-card">
    <div class="form-title">Inventory Details</div>
    <div class="form-subtitle">Enter ISBN and quality rank for the new item.</div>

    <form th:action="@{/store-owner/inventory/add}" th:object="${inventoryRequest}" method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label" for="isbn">ISBN (Format: x-xxx-xxxxx-x)</label>
          <input class="form-input"
                 id="isbn"
                 type="text"
                 th:field="*{isbn}"
                 placeholder="e.g. 0-123-45678-9"
                 pattern="[0-9]-[0-9]{3}-[0-9]{5}-[0-9]"
                 title="Must follow format: x-xxx-xxxxx-x (e.g. 0-123-45678-9)"
                 required>
          <div class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="rank">Quality Rank (1-6)</label>
          <input class="form-input"
                 id="rank"
                 type="number"
                 min="1"
                 max="6"
                 th:field="*{rank}"
                 placeholder="e.g. 3"
                 required>
          <div class="field-error" th:if="${#fields.hasErrors('rank')}" th:errors="*{rank}"></div>
        </div>

        <!-- Status is automatically set to Available in the DTO -->
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Create Item</button>
        <a class="btn btn-secondary" th:href="@{/team/inventory-module}">Back to Dashboard</a>
      </div>
    </form>
  </div>
</div>

<script>
  // Simple ISBN validation: strip dashes and check length
  document.querySelector('form').addEventListener('submit', function(e) {
    const isbnInput = document.getElementById('isbn');
    const isbn = isbnInput.value.replace(/-/g, '');
    if (isbn.length < 10 || isbn.length > 13) {
      // Just a hint, the backend will do strict check
    }
  });
</script>

</body>
</html>
