<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="en">
<head><meta charset="UTF-8"/><title>Access Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div style="min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div style="text-align:center;max-width:420px;">
    <div style="font-size:40px;margin-bottom:12px;">🔒</div>
    <h2 style="font-size:20px;font-weight:600;margin-bottom:8px;">Access Denied</h2>
    <p class="text-muted" style="margin-bottom:16px;">You do not have permission to view this page.</p>
    <sec:authorize access="!isAuthenticated()">
      <div class="alert alert-warning" style="margin-bottom:16px;text-align:left;">
        <span>⚠</span><span>You need to <a th:href="@{/auth/login}" style="color:#92400e;font-weight:600;">log in</a> to access this page.</span>
      </div>
    </sec:authorize>
    <div style="display:flex;gap:8px;justify-content:center;">
      <a class="btn btn-primary btn-sm" th:href="@{/home}">Go Home</a>
      <sec:authorize access="!isAuthenticated()">
        <a class="btn btn-secondary btn-sm" th:href="@{/auth/login}">Login</a>
      </sec:authorize>
    </div>
  </div>
</div>
<div class="footer">Book Inventory Management</div>
</body></html>
