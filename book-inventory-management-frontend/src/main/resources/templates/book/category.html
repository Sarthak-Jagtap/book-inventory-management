<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Books by Category</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Books by Category</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">Filter inventory by specific category ID</div>
			</div>

			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/books}">← Back to Books</a>
			</div>
		</div>

		<!-- Filter Form Card -->
		<div class="card" style="padding: 20px; margin-bottom: 24px;">
			<form th:action="@{/books/category}" method="get"
				style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;">
				<div style="flex: 1; min-width: 200px;">
					<label
						style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px;">Category
						ID</label>
					<select name="categoryId" class="form-control"
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;">

						<option value="">-- Select Category --</option>

						<option th:each="entry : ${categoryMap}" th:value="${entry.key}" th:text="${entry.value}"
							th:selected="${entry.key == categoryId}">
						</option>

					</select>
				</div>
				<div style="width: 80px;">
					<label
						style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px;">Size</label>
					<input type="number" name="size" th:value="${size != null ? size : 5}" class="form-control"
						style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;">
				</div>
				<input type="hidden" name="page" value="0">
				<button type="submit" class="btn btn-primary" style="height: 38px;">Apply Filter</button>
			</form>
		</div>

		<!-- Results Card -->
		<div class="card" th:if="${books != null}">
			<table class="table" style="width:100%; border-collapse:collapse;">
				<thead style="background-color: #f9fafb; border-bottom: 1px solid #e5e7eb;">
					<tr>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							ISBN</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Title</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Category</th>
						<th
							style="padding: 12px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Publisher</th>
						<th
							style="padding: 12px 16px; text-align: right; font-size: 12px; text-transform: uppercase; color: #6b7280; font-weight: 600;">
							Action</th>
					</tr>
				</thead>
				<tbody style="font-size: 14px; color: #374151;">
					<tr th:each="book : ${books}" style="border-bottom: 1px solid #f3f4f6;">
						<td style="padding: 12px 16px; font-weight: 600; font-family: monospace;"
							th:text="${book.isbn}"></td>
						<td style="padding: 12px 16px;" th:text="${book.title}"></td>
						<td style="padding: 12px 16px;" th:text="${categoryMap[book.categoryId]}"></td>
						<td style="padding: 12px 16px;" th:text="${publisherMap[book.publisherId]}"></td>
						<td style="padding: 12px 16px; text-align: right;">
							<a th:href="@{/books/details(isbn=${book.isbn})}" class="btn btn-secondary btn-sm"
								style="padding: 4px 8px;">View</a>
						</td>
					</tr>
				</tbody>
			</table>

			<!-- Pagination Footer -->
			<div
				style="padding: 16px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; background-color: #f9fafb;">
				<div style="font-size: 13px; color: #6b7280;">
					Page <span th:text="${currentPage + 1}" style="font-weight: 600; color: #111827;"></span> of <span
						th:text="${totalPages}" style="font-weight: 600; color: #111827;"></span>
				</div>
				<div style="display: flex; gap: 8px;">
					<a th:if="${currentPage > 0}"
						th:href="@{/books/category(categoryId=${categoryId}, page=${currentPage - 1}, size=${size})}"
						class="btn btn-secondary btn-sm">Previous</a>
					<a th:if="${currentPage < totalPages - 1}"
						th:href="@{/books/category(categoryId=${categoryId}, page=${currentPage + 1}, size=${size})}"
						class="btn btn-secondary btn-sm">Next</a>
				</div>
			</div>

			<div th:if="${#lists.isEmpty(books)}" style="padding: 40px; text-align: center; color: #9ca3af;">
				No books found for this category ID.
			</div>
		</div>
	</div>
</body>

</html>
