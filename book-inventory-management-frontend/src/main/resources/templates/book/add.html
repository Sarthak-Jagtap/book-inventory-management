<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Add Book</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<style>
		.form-group {
			margin-bottom: 16px;
		}

		.form-label {
			display: block;
			font-size: 14px;
			font-weight: 500;
			color: #374151;
			margin-bottom: 6px;
		}

		.form-control {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid #d1d5db;
			border-radius: 6px;
			font-size: 14px;
			box-sizing: border-box;
		}

		.form-control:focus {
			outline: none;
			border-color: #3b82f6;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="page-wrapper">

		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Add New Book</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">
					Add a new book to the inventory catalog
				</div>
			</div>
			<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

			<a class="btn btn-secondary btn-sm" th:href="@{/books}">← Back to Books</a>
		</div>

		<div class="card" style="padding:24px;max-width:600px;">
			<form th:action="@{/books/add}" method="post" th:object="${book}">

				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="form-group">
					<label class="form-label">ISBN Number</label>
					<input type="text" th:field="*{isbn}" class="form-control" required
						placeholder="13-digit ISBN e.g. 9780132350884" />
				</div>

				<div class="form-group">
					<label class="form-label">Book Title</label>
					<input type="text" th:field="*{title}" class="form-control" required
						placeholder="Enter book title" />
				</div>

				<div class="form-group">
					<label class="form-label">Description</label>
					<textarea th:field="*{description}" class="form-control" rows="4"
						placeholder="Brief description of the book..."></textarea>
				</div>

				<div class="form-group">
					<label class="form-label">Edition</label>
					<input type="text" th:field="*{edition}" class="form-control" placeholder="e.g. 1st Edition" />
				</div>

				<div class="form-group">
					<label class="form-label">Category</label>
					<select th:field="*{categoryId}" class="form-control" required>
						<option value="" disabled selected>Select a Category</option>
						<option th:each="cat : ${categories}" th:value="${cat.categoryId}"
							th:text="${cat.categoryDescription}">
						</option>
					</select>
				</div>

				<div class="form-group">
					<label class="form-label">Publisher</label>
					<select th:field="*{publisherId}" class="form-control" required>
						<option value="" disabled selected>Select a Publisher</option>
						<option th:each="pub : ${publishers}" th:value="${pub.publisherId}" th:text="${pub.name}">
						</option>
					</select>
				</div>

				<div style="margin-top:24px;display:flex;gap:12px;">
					<button type="submit" class="btn btn-primary">Add Book</button>
					<a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
				</div>

			</form>
		</div>

		<!-- Info box about next step -->
		<div class="alert alert-info" style="max-width:600px;margin-top:16px;">
			<span>ℹ</span>
			<span>After adding the book, you'll be taken to its details page where you can assign authors.</span>
		</div>

	</div>

	<div class="footer">Book Inventory Management System</div>
</body>

</html>
