<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Update Book</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<style>
		.form-group {
			margin-bottom: 16px;
		}

		.form-label {
			display: block;
			font-size: 14px;
			font-weight: 500;
			color: #374151;
			margin-bottom: 6px;
		}

		.form-control {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid #d1d5db;
			border-radius: 6px;
			font-size: 14px;
		}

		.form-control:focus {
			outline: none;
			border-color: #3b82f6;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
		}

		.readonly-input {
			background-color: #f3f4f6;
			color: #6b7280;
			cursor: not-allowed;
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="page-wrapper">
		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Update Book</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">
					Modify existing book details in the inventory
				</div>
			</div>
			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/books/details(isbn=${book.isbn})}">← Cancel</a>
			</div>
		</div>

		<div class="card" style="padding: 24px; max-width: 600px;">
			<form th:action="@{/books/update}" method="post" th:object="${book}">

				<!-- ISBN is readonly because it is the Primary Key -->
				<div class="form-group">
					<label class="form-label">ISBN Number</label>
					<input type="text" th:field="*{isbn}" class="form-control readonly-input" readonly />
					<small style="color: #6b7280; font-size: 12px;">ISBN cannot be changed.</small>
				</div>

				<div class="form-group">
					<label class="form-label">Book Title</label>
					<input type="text" th:field="*{title}" class="form-control" required
						placeholder="Enter book title" />
				</div>

				<div class="form-group">
					<label class="form-label">Description</label>
					<textarea th:field="*{description}" class="form-control" rows="4"
						placeholder="Enter book description..."></textarea>
				</div>

				<div class="form-group">
					<label class="form-label">Edition</label>
					<input type="text" th:field="*{edition}" class="form-control" placeholder="e.g., 1st Edition" />
				</div>

				<div class="form-group">
					<label class="form-label">Category</label>
					<select th:field="*{categoryId}" class="form-control" required>
						<option value="" disabled>Select a Category</option>
						<option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryDescription}">
						</option>
					</select>
				</div>

				<div class="form-group">
					<label class="form-label">Publisher</label>
					<select th:field="*{publisherId}" class="form-control" required>
						<option value="" disabled>Select a Publisher</option>
						<option th:each="pub : ${publishers}" th:value="${pub.publisherId}" th:text="${pub.name}">
						</option>
					</select>
				</div>

				<div style="margin-top: 24px;">
					<button type="submit" class="btn btn-primary">Save Changes</button>
				</div>
			</form>
		</div>
	</div>

</body>

</html>
