<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Book Details</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="page-wrapper">

		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#111827;">Book Details</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">
					Full information for this book
				</div>

			</div>
			<div> 
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/books}">← Back to Books</a>
			</div>
		</div>

		<div th:if="${successMessage}" class="alert alert-success mb-2">
			<span>✓</span>
			<span th:text="${successMessage}"></span>
		</div>

		<div class="card" style="padding: 24px; margin-bottom: 24px;">

			<table class="detail-table" style="width:100%; border-collapse:collapse;">
				<tr>
					<th
						style="width:160px; padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						ISBN</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.isbn}">—</td>
				</tr>
				<tr>
					<th
						style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						Title</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.title}">—</td>
				</tr>
				<tr>
					<th
						style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						Description</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.description}">—</td>
				</tr>
				<tr>
					<th
						style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						Edition</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.edition}">—</td>
				</tr>
				<tr>
					<th
						style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						Category</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.categoryName}">—</td>
				</tr>
				<tr>
					<th
						style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						Publisher</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.publisherName}">—</td>
				</tr>
				<tr>
					<th
						style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px; border-bottom:1px solid #f3f4f6;">
						Average Rating</th>
					<td style="padding:10px 12px; font-size:14px; border-bottom:1px solid #f3f4f6;"
						th:text="${book.averageRating != null ? book.averageRating : 'No ratings yet'}">—</td>
				</tr>
				<tr>
					<th style="padding:10px 12px; text-align:left; color:#6b7280; font-weight:500; font-size:13px;">
						Total Reviews</th>
					<td style="padding:10px 12px; font-size:14px;"
						th:text="${book.totalReviews != null ? book.totalReviews : '0'}">—</td>
				</tr>
			</table>

		</div>

		<div class="card" style="padding: 24px; margin-bottom: 24px;">
			<div style="font-size:15px; font-weight:600; margin-bottom:12px;">Authors</div>

			<div th:if="${book.authors != null and !#lists.isEmpty(book.authors)}">
				<ul style="list-style:none; padding:0; margin:0;">
					<li th:each="author : ${book.authors}"
						style="padding: 8px 0; border-bottom:1px solid #f3f4f6; font-size:14px; color:#374151;"
						th:text="${author}">
					</li>
				</ul>
			</div>

			<div th:if="${book.authors == null or #lists.isEmpty(book.authors)}" style="color:#9ca3af; font-size:13px;">
				No authors assigned to this book yet.
			</div>

			<div style="margin-top:16px;">
				<a th:href="@{/store-owner/book-authors/new(isbn=${book.isbn})}" class="btn btn-secondary btn-sm">
					Manage Authors →
				</a>
			</div>
		</div>

		<div class="flex-between">
			<a th:href="@{/books/update(isbn=${book.isbn})}" class="btn btn-primary btn-sm">Edit Book</a>
			<form th:action="@{/books/delete}" method="post" style="display:inline;"
				onsubmit="return confirm('Delete this book? This cannot be undone.');">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<input type="hidden" name="isbn" th:value="${book.isbn}" />
				<button type="submit" class="btn btn-danger btn-sm">Delete Book</button>
			</form>
		</div>

	</div>

	<div class="footer">Book Inventory Management System</div>
</body>

</html>
