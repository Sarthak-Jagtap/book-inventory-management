<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<title>Success</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="page-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
		<div class="card" style="padding: 48px; text-align: center; max-width: 500px; width: 100%;">
			<div
				style="width: 64px; height: 64px; background-color: #d1fae5; color: #059669; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px; font-weight: bold;">
				✓
			</div>
			<h2 style="font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 12px;">Success!</h2>
			<p th:text="${message}" style="color: #6b7280; font-size: 15px; margin-bottom: 32px; line-height: 1.5;"></p>

			<div style="display: flex; flex-direction: column; gap: 12px;">
				<a th:href="@{/books}" class="btn btn-primary" style="width: 100%;">Return to Book List</a>
				<a th:href="@{/team/book-module}" class="btn btn-secondary" style="width: 100%;">Go to Dashboard</a>
			</div>
		</div>
	</div>
</body>

</html>
