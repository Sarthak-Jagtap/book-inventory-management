<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Delete Book</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<style>
		.form-group {
			margin-bottom: 16px;
		}

		.form-label {
			display: block;
			font-size: 14px;
			font-weight: 500;
			color: #374151;
			margin-bottom: 6px;
		}

		.form-control {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid #d1d5db;
			border-radius: 6px;
			font-size: 14px;
		}

		.form-control:focus {
			outline: none;
			border-color: #ef4444;
			box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="page-wrapper">

		<div class="flex-between mb-2">
			<div>
				<div style="font-size:17px;font-weight:600;color:#dc2626;">Delete Book</div>
				<div style="font-size:13px;color:#6b7280;margin-top:3px;">
					Permanently remove a book from the inventory
				</div>
			</div>

			<div>
				<a class="btn btn-secondary btn-sm" th:href="@{/team/book-module}">← Dashboard</a>

				<a class="btn btn-secondary btn-sm" th:href="@{/books}">← Back to Books</a>
			</div>
		</div>

		<div class="card" style="padding: 24px; max-width: 500px; border-top: 4px solid #ef4444;">
			<p style="color: #4b5563; font-size: 14px; margin-bottom: 20px;">
				Warning: This action cannot be undone. Please enter the ISBN of the book you wish to delete.
			</p>

			<form th:action="@{/books/delete}" method="post">
				<div class="form-group">
					<label class="form-label" for="isbn">ISBN Number</label>
					<input type="text" id="isbn" name="isbn" class="form-control" required
						placeholder="Enter exact ISBN" />
				</div>

				<div style="margin-top: 24px; display: flex; gap: 12px;">
					<button type="submit" class="btn btn-danger"
						onclick="return confirm('Are you absolutely sure you want to delete this book?');">
						Permanently Delete
					</button>
					<a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
				</div>
			</form>
		</div>

	</div>

</body>

</html>
