<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Options</title>
  <link rel="stylesheet" th:href="@{/css/api-dashboard.css}">
  <style>
    .error-box{
      background:#fef2f2;
      color:#b91c1c;
      border:1px solid #fecaca;
      padding:14px 16px;
      border-radius:10px;
      margin-bottom:16px;
      white-space:pre-wrap;
      word-break:break-word;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-title">Book Inventory API</div>
  </div>
</div>

<div class="hero">
  <div class="hero-text">
    <h1>Cart Options</h1>
    <p>Available ranks and prices for the selected ISBN.</p>
  </div>
</div>

<div class="tabs">
  <a class="tab active" th:href="@{/user/cart/options(isbn=${isbn})}">Options</a>
  <a class="tab" th:href="@{/inventory-cart-dashboard}">Back</a>
</div>

<div class="content">

  <div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>

  <div class="endpoint-card get">
    <div class="ep-header">
      <span class="method-badge">GET</span>
      <span class="ep-path">/user/cart/options/{isbn}</span>
      <span class="ep-desc-inline">Available quality options</span>
    </div>
    <div class="ep-body">
      <p><strong>ISBN:</strong> <span th:text="${isbn}"></span></p>
    </div>
  </div>

  <div th:if="${options != null and !#lists.isEmpty(options)}" class="table-wrap">
    <table class="data-table">
      <thead>
      <tr>
        <th>Rank</th>
        <th>Price</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="opt : ${options}">
        <td th:text="${opt.rank}"></td>
        <td th:text="${opt.price}"></td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${options == null or #lists.isEmpty(options)}" class="empty-state">
    No quality options available.
  </div>

</div>
</body>
</html>
