<form th:action="@{/user/cart/add}" th:object="${addToCartRequest}" method="post">
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label" for="userId">User ID</label>
      <input class="form-input"
             id="userId"
             type="number"
             min="1"
             th:field="*{userId}"
             placeholder="e.g. 1000009"
             required>
      <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
    </div>

    <div class="form-group full">
      <label class="form-label" for="isbn">ISBN</label>
      <input class="form-input"
             id="isbn"
             type="text"
             th:field="*{isbn}"
             placeholder="e.g. 1-295-84547-1"
             pattern="^[0-9\\-]{10,17}$"
             title="Use numbers and dashes only, e.g. 1-295-84547-1"
             required>
      <div class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Add To Cart</button>
    <a class="btn btn-secondary" th:href="@{/user/cart/view}">View Cart</a>
    <a class="btn btn-secondary" th:href="@{/inventory-cart-dashboard}">Back</a>
  </div>
</form>
