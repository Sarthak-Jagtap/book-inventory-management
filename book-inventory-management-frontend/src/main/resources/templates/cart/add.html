<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to Your Cart</title>
  <link rel="stylesheet" th:href="@{/css/api-dashboard.css}">
  <style>
    .error-box{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:14px 16px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}
    .field-error{color:#b91c1c;font-size:12px;margin-top:4px;}
    .footer-actions {margin-top: 30px;padding-top: 20px;border-top: 1px solid var(--border);display: flex;justify-content: center;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-title">Book Inventory API</div>
    <div class="logo-sub">Cart Module</div>
  </div>
</div>

<div class="hero">
  <div class="hero-text">
    <h1>Add Book to Cart</h1>
    <p>Enter the ISBN of the book you'd like to add to your personal shopping cart.</p>
  </div>
</div>

<div class="content">

  <div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>

  <div class="form-card">
    <div class="form-title">Item ISBN</div>
    <div class="form-subtitle">Your User ID will be automatically detected from your session.</div>

    <form th:action="@{/user/cart/add}" th:object="${addToCartRequest}" method="post">
      <div class="form-grid">
        <!-- Hidden User ID field or handled by controller from session -->
        <div class="form-group full">
          <label class="form-label" for="isbn">ISBN (Format: x-xxx-xxxxx-x)</label>
          <input class="form-input"
                 id="isbn"
                 type="text"
                 th:field="*{isbn}"
                 pattern="[0-9]-[0-9]{3}-[0-9]{5}-[0-9]"
                 title="Format: x-xxx-xxxxx-x"
                 placeholder="e.g. 0-123-45678-9"
                 required>
          <div class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
          <small class="form-hint">Format must match exactly: x-xxx-xxxxx-x</small>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Add To Cart</button>
        <a class="btn btn-secondary" th:href="@{/user/cart/view}">View My Cart</a>
      </div>
    </form>
  </div>

  <div class="footer-actions">
    <a class="btn btn-secondary" th:href="@{/team/inventory-module}">Back to Dashboard</a>
  </div>

</div>
</body>
</html>
