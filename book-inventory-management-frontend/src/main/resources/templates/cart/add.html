<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add To Cart</title>
  <link rel="stylesheet" th:href="@{/css/api-dashboard.css}">
  <style>
    .error-box{
      background:#fef2f2;
      color:#b91c1c;
      border:1px solid #fecaca;
      padding:14px 16px;
      border-radius:10px;
      margin-bottom:16px;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .field-error{
      color:#b91c1c;
      font-size:12px;
      margin-top:4px;
    }
    .form-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-11z"/><path d="M6 6L4 3H1"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
    </div>
    <div>
      <div class="logo-title">Book Inventory API</div>
      <div class="logo-sub">Add To Cart</div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-text">
    <h1>Add Item To Cart</h1>
    <p>Enter a user ID and ISBN to add a book to cart.</p>
  </div>
</div>

<div class="tabs">
  <a class="tab active" th:href="@{/user/cart/add}">Add To Cart</a>
  <a class="tab" th:href="@{/user/cart/view}">View Cart</a>
  <a class="tab" th:href="@{/inventory-cart-dashboard}">Back</a>
</div>

<div class="content">

  <div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>

  <div class="endpoint-card post">
    <div class="ep-header">
      <span class="method-badge">POST</span>
      <span class="ep-path">/user/cart/add</span>
      <span class="ep-desc-inline">Add book to user cart</span>
    </div>

    <div class="ep-body">
      <form th:action="@{/user/cart/add}" th:object="${addToCartRequest}" method="post" class="api-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="userId">User ID</label>
            <input id="userId" type="number" th:field="*{userId}" placeholder="Enter user ID">
            <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
          </div>

          <div class="form-group">
            <label for="isbn">ISBN</label>
            <input id="isbn" type="text" th:field="*{isbn}" placeholder="Enter ISBN">
            <div class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Add To Cart</button>
          <a class="btn btn-secondary" th:href="@{/user/cart/view}">View Cart</a>
          <a class="btn btn-secondary" th:href="@{/inventory-cart-dashboard}">Back</a>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
