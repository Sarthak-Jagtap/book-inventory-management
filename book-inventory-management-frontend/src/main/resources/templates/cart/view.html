<div th:if="${apiError != null}" class="error-box" th:text="${apiError}"></div>
<div th:if="${checkoutMessage != null}" class="success-box" th:text="${checkoutMessage}"></div>

<div class="lookup-card">
  <div class="form-title">Find Cart By User ID</div>
  <div class="form-subtitle">Enter user ID to load cart items.</div>

  <form th:action="@{/user/cart/view}" method="get">
    <div class="lookup-grid">
      <div class="form-group">
        <label class="form-label" for="userIdLookup">User ID</label>
        <input class="form-input"
               id="userIdLookup"
               name="userId"
               type="number"
               min="1"
               th:value="${searchedUserId}"
               placeholder="e.g. 1000009"
               required>
      </div>
      <div class="form-group">
        <button class="btn btn-primary" type="submit">View Cart</button>
      </div>
    </div>
  </form>
</div>

<form th:if="${userId != null and cartView != null and !#lists.isEmpty(cartView)}"
      th:action="@{/user/cart/checkout}"
      method="post">

  <input type="hidden" name="userId" th:value="${userId}">

  <div class="table-wrap">
    <table class="data-table">
      <thead>
      <tr>
        <th>ISBN</th>
        <th>Book Title</th>
        <th>Select Condition</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item, iter : ${cartView}">
        <td th:text="${item.isbn}"></td>
        <td th:text="${item.bookTitle}"></td>

        <td>
          <input type="hidden" name="isbn" th:value="${item.isbn}"/>

          <div th:if="${optionsByIsbn[item.isbn] != null and !#lists.isEmpty(optionsByIsbn[item.isbn])}">
            <select class="form-select" name="rank" required>
              <option value="">Choose condition</option>
              <option th:each="opt : ${optionsByIsbn[item.isbn]}"
                      th:value="${opt.rank}"
                      th:text="${opt.condition + ' - ₹' + opt.price + ' (' + opt.availableCount + ' available)'}">
              </option>
            </select>
          </div>

          <div th:if="${optionsByIsbn[item.isbn] == null or #lists.isEmpty(optionsByIsbn[item.isbn])}"
               style="color:#b91c1c; font-weight:600;">
            ✖ No copies available
          </div>
        </td>

        <td>
          <form class="inline-form remove-form" th:action="@{/user/cart/remove}" method="post">
            <input type="hidden" name="userId" th:value="${userId}">
            <input type="hidden" name="isbn" th:value="${item.isbn}">
            <button class="btn btn-danger" type="submit">Remove</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="actions-row" style="margin-top:18px">
    <button class="btn btn-success" type="submit">Checkout</button>
  </div>
</form>
