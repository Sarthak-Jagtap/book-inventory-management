# SERVER CONFIG
server.port=8080
spring.application.name=book-inventory-management

# DATABASE CONFIG
spring.datasource.url=jdbc:mysql://localhost:3306/book
spring.datasource.username=root
spring.datasource.password=mysql192003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# LOGGING
logging.level.com.bookinventory=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT CONFIG
jwt.secret=BookInventoryCapgeminiProjectSecretKey2024VeryLongSecretKey
jwt.expiration=86400000