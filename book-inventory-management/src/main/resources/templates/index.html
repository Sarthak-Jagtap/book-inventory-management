<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Inventory System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fc;--surface:#fff;--surface2:#f0f2f8;--text:#1a1d2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --accent:#6366f1;--accent2:#818cf8;--accent-hover:#4f46e5;
}
body.dark{
  --bg:#0f1117;--surface:#1a1d2e;--surface2:#252840;--text:#e8eaf6;--text2:#9ca3af;--text3:#6b7280;
  --border:#2d3148;--border2:#3d4165;
  --accent:#818cf8;--accent2:#a5b4fc;--accent-hover:#6366f1;
}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  transition:background .3s,color .3s;
  min-height:100vh;display:flex;flex-direction:column;
}

.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:32px;height:32px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.logo-title{font-size:15px;font-weight:600;color:var(--text)}

.btn-dark{
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
}
.container{
  max-width:800px;margin:60px auto;padding:0 32px;text-align:center;
}
.hero h1{font-size:36px;font-weight:800;margin-bottom:12px}
.hero p{font-size:16px;color:var(--text2);margin-bottom:40px}

.btn-primary{
  background:var(--accent);color:#fff;text-decoration:none;
  padding:14px 28px;border-radius:12px;font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;
}
</style>
</head>

<body class="dark">

<div class="topbar">
  <div class="logo">
    <div class="logo-title">Book Inventory System</div>
  </div>
  <button class="btn-dark" onclick="toggleDark()">
    <span id="dark-icon">☀️</span>
  </button>
</div>

<div class="container">
  
  <div class="hero">
    <h1>Welcome to the System</h1>
    <p>A robust backend architecture for managing books and reviews.</p>
  </div>

  <!-- 🔥 MERGED BUTTON (IMPORTANT) -->
  <a th:href="@{/api-author-dashboard}" class="btn-primary">
    Launch API Dashboard
  </a>

</div>

<script>
// Theme Initialization
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if(savedTheme === 'light') {
    document.body.classList.remove('dark');
    document.getElementById('dark-icon').textContent = '🌙';
  }
});

// Toggle
function toggleDark() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('dark-icon').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
</script>

</body>
</html>
