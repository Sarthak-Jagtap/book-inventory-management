<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout Page</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Checkout</h1>
        <p><strong>User:</strong> <span th:text="${userName}"></span></p>

        <div th:if="${checkoutResponse != null}" class="card">
            <p th:text="${checkoutResponse.message}"></p>
        </div>

        <table>
            <tr>
                <th>Book Title</th>
                <th>Selected Condition</th>
                <th>Selected Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.bookTitle}"></td>
                <td th:text="${item.selectedCondition != null ? item.selectedCondition : 'Not selected'}"></td>
                <td th:text="${item.selectedPrice != null ? item.selectedPrice : '-'}"></td>
                <td>
                    <span th:if="${item.selected}" class="status-ok">Ready</span>
                    <span th:if="${!item.selected}" class="status-warn">Reselect Required</span>
                </td>
                <td>
                    <a th:if="${!item.selected}"
                       class="btn btn-secondary"
                       th:href="@{/user-page/book/{userId}/{isbn}(userId=${item.userId}, isbn=${item.isbn}, next='checkout')}">
                        Reselect
                    </a>
                </td>
            </tr>
        </table>

        <br>

		<form th:if="${canCheckout}" th:action="@{/user-page/cart/checkout}" method="post">
		    <input type="hidden" name="userId" th:value="${userId}" />
		    <button type="submit">Confirm Checkout</button>
		</form>

        <a class="btn btn-secondary" th:href="@{/user-page/cart/{userId}(userId=${userId})}" >Back to Cart</a>
    </div>
</div>
</body>
</html>
