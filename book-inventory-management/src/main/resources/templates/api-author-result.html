<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>API Result</title>

<style>

body{
font-family:Segoe UI, Arial;
background:#f5f7fa;
margin:0;
padding:40px;
}

h2{
margin-bottom:10px;
}

.success{
color:#28a745;
font-weight:bold;
}

.error{
color:#dc3545;
font-weight:bold;
}

table{
border-collapse:collapse;
width:100%;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
}

th{
background:#f2f2f2;
}

.json{
background:#1e1e1e;
color:#eee;
padding:15px;
border-radius:6px;
margin-top:20px;
font-family:monospace;
white-space:pre;
}

</style>

</head>

<body>

<h2>API Response</h2>

<p>
Status:
<span th:text="${response.success}"
      th:classappend="${response.success} ? 'success' : 'error'">
</span>
</p>

<p>
<b>Message:</b>
<span th:text="${response.message}"></span>
</p>

<hr>

<h3>Data</h3>

<!-- IF DATA IS A LIST -->
<table th:if="${response.data instanceof T(java.util.List)}">

<tr>
<th th:each="key : ${response.data[0].keySet()}"
    th:text="${key}">
</th>
</tr>

<tr th:each="row : ${response.data}">
<td th:each="val : ${row.values()}"
    th:text="${val}">
</td>
</tr>

</table>


<!-- IF DATA IS OBJECT / MAP -->
<table th:if="${response.data instanceof T(java.util.Map)}">

<tr>
<th>Field</th>
<th>Value</th>
</tr>

<tr th:each="entry : ${response.data.entrySet()}">
<td th:text="${entry.key}"></td>
<td th:text="${entry.value}"></td>
</tr>

</table>


<hr>

<h3>Raw JSON</h3>

<div class="json" th:text="${response}"></div>

</body>

</html>
