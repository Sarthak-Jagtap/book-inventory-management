<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Inventory</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Add Inventory</h1>

        <form th:action="@{/admin-page/inventory/add}" method="post">
            <div class="form-row">
                <label>ISBN</label><br>
                <input type="text" name="isbn" required />
            </div>

            <div class="form-row">
                <label>Rank</label><br>
                <input type="number" name="rank" min="1" max="6" required />
            </div>

            <div class="form-row">
                <label>Purchased</label><br>
                <select name="purchased">
                    <option value="false">false</option>
                    <option value="true">true</option>
                </select>
            </div>

            <button type="submit">Add Inventory</button>
        </form>
    </div>
</div>
</body>
</html>
